    <style>
      /* ─── Critical CSS — loader (LKL 2026) ─── */
      html, body { background: #FFFFFF; }
      html.dark, html.dark body { background: #100D0B; }
      body.loading { overflow: hidden; }
      body.loading #root { opacity: 0; }

      .loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: opacity, transform;
      }
      html.dark .loader-overlay { background: #100D0B; }

      .loader-mark {
        width: clamp(88px, 22vw, 140px);
        opacity: 0;
        transform: scale(0.92) translateY(8px);
        animation: mark-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards,
          mark-breathe 1.8s ease-in-out 0.65s infinite;
      }
      .loader-mark img {
        display: block;
        width: 100%;
        height: auto;
      }
      @keyframes mark-in {
        from { opacity: 0; transform: scale(0.92) translateY(8px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes mark-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      /* thin progress bar at the bottom */
      .loader-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      html.dark .loader-bar { background: rgba(244, 238, 231, 0.08); }
      .loader-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        transform-origin: left;
        background: #FF6A30;
        animation: bar-fill 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes bar-fill {
        0% { transform: scaleX(0); }
        70% { transform: scaleX(0.75); }
        100% { transform: scaleX(0.97); }
      }

      /* Phase 1: mark + bar fade out */
      .loader-overlay.phase-out .loader-mark,
      .loader-overlay.phase-out .loader-bar {
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      /* Phase 2: wipe the whole overlay upward */
      .loader-overlay.phase-wipe {
        animation: overlay-wipe 0.35s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      @keyframes overlay-wipe {
        from { transform: translateY(0); }
        to { transform: translateY(-101%); }
      }

      body:not(.loading) #root {
        animation: content-reveal 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes content-reveal {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-mark, .loader-bar::after,
        .loader-overlay.phase-wipe, body:not(.loading) #root { animation: none !important; }
        .loader-mark { opacity: 1; transform: none; }
      }
    </style>

  <body class="loading">
    <!-- Loader -->
    <div id="page-loader" class="loader-overlay">

      <div class="loader-bar" aria-hidden="true"></div>

    <div id="root"></div>

    <script>
      (function() {
        var loader = document.getElementById('page-loader');
        var minDisplay = 300;
        var startTime = performance.now();
        var dismissed = false;

        function dismissLoader() {
          if (dismissed || !loader) return;
          dismissed = true;
          var elapsed = performance.now() - startTime;
          var remaining = Math.max(0, minDisplay - elapsed);

          setTimeout(function() {
            loader.classList.add('phase-out');
            setTimeout(function() {
              loader.classList.add('phase-wipe');
              setTimeout(function() {
                if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
                document.body.classList.remove('loading');
                window.dispatchEvent(new Event('lkl-loader-dismissed'));
              }, 350);
            }, 150);
          }, remaining);
        }

        window.addEventListener('load', dismissLoader);
        setTimeout(dismissLoader, 2500);
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(r) { r.unregister(); });
        });
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
    </script>
